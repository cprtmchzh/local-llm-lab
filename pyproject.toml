[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-lab"
version = "0.1.0"
description = "Local-only Ollama CLI and reproducible model evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llm = "cli.main:main"
llm-agent = "agent.coding_agent:main"
llm-benchmark = "benchmark.runner:main"
llm-score = "benchmark.scorers:main"

[tool.setuptools]
packages = ["cli", "agent", "benchmark"]

[tool.unittest]
start-directory = "tests"
