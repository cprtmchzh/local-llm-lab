[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-lab"
version = "0.1.0"
description = "Local-only Ollama CLI and reproducible model evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llm = "cli.main:main"
llm-agent = "agent.coding_agent:main"
llm-benchmark = "benchmark.runner:main"
llm-offensive-benchmark = "benchmark.offensive_runner:main"
llm-score = "benchmark.scorers:main"
llm-verify-evidence = "benchmark.evidence:main"

[tool.setuptools]
packages = ["cli", "agent", "benchmark", "benchmark.offensive_lab"]

[tool.setuptools.package-data]
"benchmark.offensive_lab" = ["catalog.json", "docker-compose.yml", "Dockerfile"]

[tool.unittest]
start-directory = "tests"
