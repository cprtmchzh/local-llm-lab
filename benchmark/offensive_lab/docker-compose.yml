services:
  target:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - isolated_lab
    environment:
      LAB_RUN_TOKEN: "${LAB_RUN_TOKEN:-local-manual-run}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15
networks:
  isolated_lab:
    internal: true
